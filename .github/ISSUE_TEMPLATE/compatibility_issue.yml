name: Compatibility issue
description: Report a compatibility problem with WordPress, PHP, WooCommerce, themes, or plugins
title: "[Compatibility]: "
labels: [compatibility]
body:
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
    validations:
      required: true
  - type: input
    id: wordpress-version
    attributes:
      label: WordPress version
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
    validations:
      required: true
  - type: input
    id: woocommerce-version
    attributes:
      label: WooCommerce version, if applicable
  - type: textarea
    id: conflict
    attributes:
      label: Conflict details
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: checkboxes
    id: sensitive-data
    attributes:
      label: Sensitive data check
      options:
        - label: I confirm this report does not include secrets or customer data.
          required: true