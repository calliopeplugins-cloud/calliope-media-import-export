name: Bug report
description: Report a reproducible plugin issue
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
    validations:
      required: true
  - type: input
    id: wordpress-version
    attributes:
      label: WordPress version
    validations:
      required: true
  - type: input
    id: woocommerce-version
    attributes:
      label: WooCommerce version, if applicable
  - type: input
    id: php-version
    attributes:
      label: PHP version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Do not include secrets, customer data, tokens, passwords, API keys, or license keys.
  - type: checkboxes
    id: sensitive-data
    attributes:
      label: Sensitive data check
      options:
        - label: I confirm this report does not include secrets or customer data.
          required: true